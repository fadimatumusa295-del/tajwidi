let R=L1,LI=0;
function sel(i){LI=i;R=LS[i].R;Q=null;render()}
function picker(){return `<div class="lp">${LS.map((l,i)=>`<button class="${i==LI?'on':''}" onclick="sel(${i})">${i+1}. ${l.ha}</button>`).join('')}</div>`}
const S=load(); let tab='learn', Q=null;
function load(){try{const j=JSON.parse(localStorage.getItem('tj1')||'{}');return{done:j.done||{},best:(j.best&&typeof j.best==='object')?j.best:{}}}catch(e){return{done:{},best:{}}}}
function save(){try{localStorage.setItem('tj1',JSON.stringify({done:S.done,best:S.best}))}catch(e){}}
const v=document.getElementById('v');
function go(t){tab=t;if(t==='quiz'&&!Q)startQ();render()}
function mark(k){S.done[k]=1;save();render()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function learn(){
let h=LI?LS[LI].intro:`<div class="card"><h2>Ma’ana | التَّعْرِيفُ</h2>
<p class="ar"><b>النُّونُ السَّاكِنَةُ:</b> نُونٌ خَالِيَةٌ مِنَ الْحَرَكَةِ، تَثْبُتُ لَفْظًا وَخَطًّا. مِثْلُ: مِنْ، يَنْهَوْنَ.</p>
<p><b>Nun Sakinah:</b> nun ce marar motsi (sukuni), ana rubuta ta kuma ana furta ta, a tsakiya ko ƙarshen kalma.</p>
<p class="ar"><b>التَّنْوِينُ:</b> نُونٌ سَاكِنَةٌ زَائِدَةٌ تَلْحَقُ آخِرَ الِاسْمِ لَفْظًا لَا خَطًّا. مِثْلُ: عَلِيمٌ.</p>
<p><b>Tanwin:</b> ƙarin sautin nun a ƙarshen suna, ana furta shi amma ba a rubuta shi a matsayin harafi ba.</p>
<p class="ar"><b>الْغُنَّةُ:</b> صَوْتٌ يَخْرُجُ مِنَ الْخَيْشُومِ، مِقْدَارُهَا حَرَكَتَانِ.</p>
<p><b>Ghunnah:</b> sautin hanci, tsawonsa kamar motsi biyu.</p></div>`;
R.forEach((r,i)=>{
h+=`<details class="card" ${i==0?'open':''}><summary><span class="ar">${r.ar}</span><span>${r.ha}</span><b class="n">${r.n}</b></summary>
<p class="ar">${r.dAr}</p><p>${r.dHa}</p>${r.x?`<div class="tip"><p class="ar">${r.x[0]}</p><p>${r.x[1]}</p></div>`:''}
<div class="chips">${r.L.split(' ').map(c=>`<i class="c">${c}</i>`).join('')}</div><ul>`;
r.it.forEach(x=>{h+=`<li><i class="c">${x[0]}</i><div><div class="ar" style="line-height:1.7">${x[1]}</div><div class="m">${x[2]}${x[3]=='g'?' · da ghunnah':x[3]=='n'?' · ba ghunnah':''}</div></div></li>`});
h+=`</ul><button class="btn ${S.done[r.k]?'o':''}" onclick="mark('${r.k}')">${S.done[r.k]?'✓ An karanta':'Na gama karantawa'}</button></details>`});
h+=`<p class="m" style="text-align:center">Ka nuna wannan ga ƙwararren malamin tajwidi kafin ka dogara da shi.</p>`;
return h}
function startQ(){
const pool=[];R.forEach(r=>r.it.forEach(x=>pool.push({k:r.k,l:x[0],a:x[1],h:x[2]})));
Q={list:shuffle(pool).slice(0,8),i:0,s:0,a:null}}
function pick(k){if(Q.a)return;Q.a=k;if(k===Q.list[Q.i].k)Q.s++;render()}
function next(){Q.i++;Q.a=null;if(Q.i>=Q.list.length&&Q.s>(S.best[LS[LI].id]||0)){S.best[LS[LI].id]=Q.s;save()}render()}
function quiz(){
if(Q.i>=Q.list.length)return `<div class="card" style="text-align:center"><h2>Sakamako</h2><p style="font-size:2rem;margin:4px">${Q.s} / ${Q.list.length}</p><p>${Q.s>=7?'Madalla!':Q.s>=5?'Da kyau, sake gwadawa zai ƙara maka.':'Koma darasin ka sake gwadawa.'}</p><button class="btn" onclick="Q=null;go('quiz')">Sake gwadawa</button></div>`;
const q=Q.list[Q.i],rr=R.find(r=>r.k===q.k);
let h=`<div class="card"><div class="m">Tambaya ${Q.i+1} / ${Q.list.length}</div><div class="bar"><div style="width:${Q.i/Q.list.length*100}%"></div></div>
<p class="ar" style="text-align:center;margin:0">أَيُّ حُكْمٍ فِي:</p><p style="text-align:center;margin:0" class="m">Wane hukunci ne a cikin:</p><div class="q">${q.a}</div>`;
R.forEach(r=>{const c=Q.a?(r.k===q.k?'ok':r.k===Q.a?'bad':''):'';h+=`<button class="opt ${c}" ${Q.a?'disabled':''} onclick="pick('${r.k}')"><span class="ar">${r.ar}</span><span>${r.ha}</span></button>`});
if(Q.a){h+=`<p>${Q.a===q.k?'✓ Daidai.':'✗ Ba daidai ba.'} Harafin <i class="c">${q.l}</i> yana ƙarƙashin <b>${rr.ha}</b>. <span class="m">(${q.h})</span></p><button class="btn" onclick="next()">${Q.i+1>=Q.list.length?'Ga sakamako':'Na gaba'}</button>`}
return h+'</div>'}
function prog(){
const AR=LS.flatMap(l=>l.R),d=AR.filter(r=>S.done[r.k]).length;
return `<div class="card"><h2>Ci gaban ka</h2><p>Hukunce-hukuncen da ka karanta: <b>${d} / ${AR.length}</b></p><div class="bar"><div style="width:${d/AR.length*100}%"></div></div>
<p>Mafi kyawun maki a jarrabawa:</p>${LS.map(l=>`<p style="margin:2px 0">${l.ha}: <b>${S.best[l.id]||0} / 8</b></p>`).join('')}
<button class="btn o" onclick="if(confirm('Ka goge ci gaban?')){S.done={};S.best={};save();render()}">Goge ci gaba</button></div>`}
function render(){
v.innerHTML=(tab==='prog'?'':picker())+(tab==='learn'?learn():tab==='quiz'?quiz():prog());
['learn','quiz','prog'].forEach(t=>document.getElementById('t-'+t).classList.toggle('on',t===tab));
window.scrollTo(0,0)}
render();
</script>
